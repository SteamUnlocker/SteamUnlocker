[package]
name = "steamunlocker"
version = "1.6.1"
description = "SteamUnlocker - Gestionnaire local Steam & Lua"
authors = ["Axolat"]
edition = "2024"

[lib]
name = "steamunlocker_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
